env: local
log_level: info
shutdown_timeout: 10s

http-server:
  address: ":8080"
  read_header_timeout: 5s
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s

database:
  max_conns: 10
  min_conns: 2
  max_conn_lifetime: 30m
  connect_timeout: 5s
  query_timeout: 3s
  # url задается переменной окружения DATABASE_URL.

max:
  # longpoll — локальная разработка без публичного адреса, webhook — продакшен.
  mode: longpoll
  api_url: "https://platform-api2.max.ru"
  # access_token задается переменной окружения MAX_ACCESS_TOKEN.
  longpoll_wait: 25s
  # Лимит платформы: не более двух сообщений в секунду в диалог.
  send_interval: 600ms

campaign:
  # start_date: "2026-11-01"
  # end_date: "2026-11-10"
  main_prize: "главный приз акции"
  max_chances: 10

draw:
  time: "21:00"
  timezone: Europe/Moscow
  final_winners: 5
  tickets_per_winner: 2
  reserve_count: 3
  auto_final: false

admin:
  # token задается переменной окружения ADMIN_TOKEN.
