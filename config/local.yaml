env: local
log_level: info
shutdown_timeout: 10s
# Баннер приветствия как вложение VK, например photo-123_456; пусто — без баннера.
banner: ""

http-server:
  address: ":8080"
  read_header_timeout: 5s
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s

database:
  max_conns: 10
  min_conns: 2
  max_conn_lifetime: 30m
  connect_timeout: 5s
  query_timeout: 3s
  # url задается переменной окружения DATABASE_URL.

vk:
  # longpoll — локальная разработка без публичного адреса, callback — продакшен.
  mode: longpoll
  group_id: 0
  # token задается переменной окружения VK_TOKEN.
  api_version: "5.199"
  confirmation: "" # строка подтверждения Callback API
  secret: "" # секрет Callback API, проверяется когда задан
  longpoll_wait: 25s
  send_interval: 60ms

campaign:
  # start_date: "2026-11-01"
  # end_date: "2026-11-10"
  main_prize: "главный приз акции"
  max_chances: 10

draw:
  time: "21:00"
  timezone: Europe/Moscow
  final_winners: 5
  tickets_per_winner: 2
  reserve_count: 3
  auto_final: false

admin:
  # token задается переменной окружения ADMIN_TOKEN.
