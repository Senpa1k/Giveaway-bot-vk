name: giveaway-bot-vk

services:
  bot:
    build:
      context: .
    ports:
      - "127.0.0.1:${BOT_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-giveaway}:${POSTGRES_PASSWORD:-local_dev_only}@postgres:5432/${POSTGRES_DB:-giveaway}?sslmode=disable"
      VK_MODE: "${VK_MODE:-callback}"
      VK_GROUP_ID: "${VK_GROUP_ID:-0}"
      VK_TOKEN: "${VK_TOKEN:?set VK_TOKEN in .env}"
      VK_CONFIRMATION: "${VK_CONFIRMATION:-}"
      VK_SECRET: "${VK_SECRET:-}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}"
      CAMPAIGN_START_DATE: "${CAMPAIGN_START_DATE:-}"
      CAMPAIGN_END_DATE: "${CAMPAIGN_END_DATE:-}"
      CAMPAIGN_MAIN_PRIZE: "${CAMPAIGN_MAIN_PRIZE:-}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-giveaway}"
      POSTGRES_USER: "${POSTGRES_USER:-giveaway}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local_dev_only}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
