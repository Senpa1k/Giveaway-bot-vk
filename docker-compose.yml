name: giveaway-bot-max

services:
  bot:
    build:
      context: .
    ports:
      - "127.0.0.1:${BOT_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-giveaway}:${POSTGRES_PASSWORD:-local_dev_only}@postgres:5432/${POSTGRES_DB:-giveaway}?sslmode=disable"
      MAX_MODE: "${MAX_MODE:-webhook}"
      MAX_API_URL: "${MAX_API_URL:-https://platform-api2.max.ru}"
      MAX_ACCESS_TOKEN: "${MAX_ACCESS_TOKEN:?set MAX_ACCESS_TOKEN in .env}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}"
      CAMPAIGN_START_DATE: "${CAMPAIGN_START_DATE:-}"
      CAMPAIGN_END_DATE: "${CAMPAIGN_END_DATE:-}"
      CAMPAIGN_MAIN_PRIZE: "${CAMPAIGN_MAIN_PRIZE:-}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-giveaway}"
      POSTGRES_USER: "${POSTGRES_USER:-giveaway}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local_dev_only}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
